<!-- stage-10-render-harness.html — Stage 10 Parcel 6 (light / default entry). -->
<!-- Permanent, servable a11y-audit fixture that mounts the LIVE Edit-Alt -->
<!-- sub-view (decorative-ON-with-conflict) via the shared mount script. The -->
<!-- dark twin (stage-10-render-harness-dark.html) is identical except for an -->
<!-- inline pre-mount theme-force. New file only — no existing file is edited. -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stage 10 render harness — Edit Alt Text (light)</title>

    <!-- Theme links: mirror tools.html exactly (prefers-color-scheme media). -->
    <link
      rel="stylesheet"
      id="lightCSS"
      href="../light.css"
      media="(prefers-color-scheme: light)"
    />
    <link rel="stylesheet" id="mainCSS" href="../main.css" media="all" />
    <link
      rel="stylesheet"
      id="darkCSS"
      href="../dark.css"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Styling for the Edit-Alt view and the inlined ⓘ icon. -->
    <link
      rel="stylesheet"
      href="../mathpix-scripts/css/mathpix-image-manager.css"
    />
    <link rel="stylesheet" href="../icon-library.css" />
  </head>
  <body>
    <main>
      <h1>Stage 10 render harness — Edit Alt Text view</h1>
      <p>
        This page mounts the live Edit Alt Text sub-view of the MathPix Image
        Manager in its decorative-on-with-conflict state for accessibility
        auditing. Untick the decorative checkbox to see the off state.
      </p>
      <div id="harness-mount"></div>
    </main>

    <!-- icon-library.js BEFORE the mount so getIcon("infoCircle") resolves. -->
    <script src="../icon-library.js"></script>
    <script src="../mathpix-scripts/ui/components/mathpix-image-manager-ui.js"></script>
    <script src="stage-10-render-harness.js"></script>
  </body>
</html>
